<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #08030a;
    color: white;
    overflow-x: hidden;
}

/* =========================
   FONDO
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255, 210, 60, .15), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255, 180, 30, .12), transparent 30%);
    pointer-events: none;
    z-index: -1;
}

/* =========================
   PANTALLA ÚNICA
========================= */

.intro {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    padding: 60px 25px;
}

.intro-content {
    animation: aparecer 2s ease forwards;
}

.small-text {
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffd75e;
    margin-bottom: 20px;
}

.intro h1 {
    font-size: clamp(42px, 12vw, 75px);
    line-height: 1;
    margin-bottom: 25px;
    font-weight: 700;
}

.intro h1 span {
    color: #ffcc33;
}

.intro p {
    color: #d8cbd0;
    font-size: 17px;
    margin-bottom: 35px;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   RAMO DE GIRASOLES
========================= */

.bouquet-wrap {
    width: min(80vw, 320px);
    margin: 0 auto 15px;
    filter: drop-shadow(0 20px 30px rgba(255, 190, 20, .18));
}

.bouquet-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
}

.stem {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: mecerTallo 4s ease-in-out infinite;
}

.leaf {
    transform-box: fill-box;
    transform-origin: center;
    animation: mecerHoja 3.2s ease-in-out infinite;
}

.flower {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: mecerFlor 4s ease-in-out infinite;
}

.petal {
    transform-box: fill-box;
    transform-origin: center;
    animation: respirarPetalo 2.6s ease-in-out infinite;
}

.f1 { animation-delay: 0s; }
.f2 { animation-delay: .4s; }
.f3 { animation-delay: .8s; }
.f4 { animation-delay: 1.2s; }
.f5 { animation-delay: .2s; }
.f6 { animation-delay: .6s; }
.f7 { animation-delay: 1s; }
.f8 { animation-delay: .9s; }

@keyframes mecerTallo {
    0%, 100% {
        transform: rotate(-4deg);
    }
    50% {
        transform: rotate(4deg);
    }
}

@keyframes mecerFlor {
    0%, 100% {
        transform: rotate(-7deg) translateY(0);
    }
    50% {
        transform: rotate(7deg) translateY(-3px);
    }
}

@keyframes mecerHoja {
    0%, 100% {
        transform: rotate(-8deg) scale(1);
    }
    50% {
        transform: rotate(6deg) scale(1.03);
    }
}

@keyframes respirarPetalo {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.06);
    }
}

/* =========================
   CONTADOR
========================= */

.counter-label {
    color: #ffd75e;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 12px;
    margin-bottom: 12px;
}

.counter {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 35px;
    max-width: 480px;
}

.counter-item {
    background: rgba(255, 204, 51, .08);
    border: 1px solid rgba(255, 204, 51, .25);
    border-radius: 14px;
    padding: 10px 14px;
    min-width: 68px;
}

.counter-item strong {
    display: block;
    font-size: 22px;
    color: #ffcc33;
}

.counter-item span {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #d8cbd0;
}

.wish-text {
    color: #f2e6c8;
    font-size: 18px;
    margin-bottom: 6px;
}

.love-text {
    color: #ffcc33;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.signature {
    color: #d8cbd0;
    font-size: 16px;
    font-style: italic;
}

/* =========================
   GIRASOLES FLOTANTES
========================= */

.floating-sunflower {
    position: fixed;
    bottom: -30px;
    font-size: 20px;
    pointer-events: none;
    animation: subir linear forwards;
    z-index: 100;
}

@keyframes subir {
    from {
        transform: translateY(0) rotate(0);
        opacity: 1;
    }

    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* =========================
   MÚSICA
========================= */

.music-button {
    position: fixed;
    right: 18px;
    top: 18px;
    z-index: 999;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(30,10,20,.8);
    color: white;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(10px);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .intro h1 {
        font-size: 48px;
    }

    .counter-item {
        min-width: 60px;
        padding: 8px 10px;
    }
}
</style>
</head>

<script>

/* ==================================
   FECHA DE INICIO
   (CAMBIÁ ESTA FECHA POR LA REAL)
================================== */

const FECHA_INICIO = new Date("2011-01-10T16:00:00");


/* ==================================
   CONTADOR
================================== */

function actualizarContador() {

    const ahora = new Date();

    let años = ahora.getFullYear() - FECHA_INICIO.getFullYear();
    let meses = ahora.getMonth() - FECHA_INICIO.getMonth();
    let dias = ahora.getDate() - FECHA_INICIO.getDate();
    let horas = ahora.getHours() - FECHA_INICIO.getHours();
    let minutos = ahora.getMinutes() - FECHA_INICIO.getMinutes();
    let segundos = ahora.getSeconds() - FECHA_INICIO.getSeconds();

    if (segundos < 0) {
        segundos += 60;
        minutos--;
    }

    if (minutos < 0) {
        minutos += 60;
        horas--;
    }

    if (horas < 0) {
        horas += 24;
        dias--;
    }

    if (dias < 0) {
        const mesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0);
        dias += mesAnterior.getDate();
        meses--;
    }

    if (meses < 0) {
        meses += 12;
        años--;
    }

    document.getElementById("c-años").textContent = String(años).padStart(2, "0");
    document.getElementById("c-meses").textContent = String(meses).padStart(2, "0");
    document.getElementById("c-dias").textContent = String(dias).padStart(2, "0");
    document.getElementById("c-horas").textContent = String(horas).padStart(2, "0");
    document.getElementById("c-minutos").textContent = String(minutos).padStart(2, "0");
    document.getElementById("c-segundos").textContent = String(segundos).padStart(2, "0");

}

actualizarContador();
setInterval(actualizarContador, 1000);


/* ==================================
   GIRASOLES FLOTANTES
================================== */

function crearGirasol() {

    const flor = document.createElement("div");

    flor.className = "floating-sunflower";

    flor.innerHTML = "🌻";

    flor.style.left =
        Math.random() * 100 + "vw";

    flor.style.fontSize =
        (15 + Math.random() * 20) + "px";

    flor.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(flor);

    setTimeout(() => {

        flor.remove();

    }, 9000);

}


function crearGirasoles(cantidad) {

    for (let i = 0; i < cantidad; i++) {

        setTimeout(
            crearGirasol,
            i * 150
        );

    }

}


/* ==================================
   GIRASOLES AUTOMÁTICOS
================================== */

setInterval(() => {

    crearGirasol();

}, 1200);


/* ==================================
   MÚSICA
================================== */

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

let musicPlaying = false;


musicButton.addEventListener("click", () => {

    if (musicPlaying) {

        music.pause();

        musicPlaying = false;

        musicButton.innerHTML = "🔇";

    } else {

        music.play();

        musicPlaying = true;

        musicButton.innerHTML = "🎵";

    }

});


/* ==================================
   CLICK EN CUALQUIER PARTE
================================== */

document.addEventListener("click", () => {

    crearGirasoles(2);

});

</script>
